name: Build Tazmin Faktor

on:
  push:
    paths:
      - 'source.enc'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # سورس رمزدار است؛ رمز فقط در Settings → Secrets → Actions با اسم SRC_PASS ذخیره می‌شود
      - name: Decrypt source
        env:
          SRC_PASS: ${{ secrets.SRC_PASS }}
        run: |
          if [ -z "$SRC_PASS" ]; then echo "::error::Secret SRC_PASS is not set"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/src"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in source.enc -out "$RUNNER_TEMP/src.zip" -pass env:SRC_PASS
          unzip -q "$RUNNER_TEMP/src.zip" -d "$RUNNER_TEMP/src"
          rm -f "$RUNNER_TEMP/src.zip"
          echo "SRC=$RUNNER_TEMP/src" >> "$GITHUB_ENV"

      # کتابخانه‌های ساخت عکس و PDF و فونت وزیرمتن داخل برنامه قرار می‌گیرند تا بدون اینترنت هم کار کند
      - name: Bundle offline libraries
        run: |
          V="$SRC/app/src/main/assets/vendor"; T="$RUNNER_TEMP/npm"; mkdir -p "$T" && cd "$T"
          npm pack html2canvas@1.4.1 jspdf@2.5.1 vazirmatn@33.0.3 @zxing/library@0.21.3 >/dev/null
          for f in *.tgz; do mkdir -p "x/$f" && tar -xzf "$f" -C "x/$f"; done
          cp "$(find x -path '*html2canvas*' -name html2canvas.min.js | head -1)" "$V/"
          cp "$(find x -path '*jspdf*' -name jspdf.umd.min.js | head -1)" "$V/"
          cp "$(find x -path '*zxing*' -path '*umd*' -name index.min.js | head -1)" "$V/zxing.min.js"
          for w in Regular Medium Bold ExtraBold; do f=$(find x -name "Vazirmatn-$w.woff2" | grep -v -i "variable\|UI\|RD\|FD" | head -1); [ -n "$f" ] && cp "$f" "$V/"; done
          ls -la "$V"

      # فونت‌های فارسی آزاد (OFL) برای فاکتور — فقط فونت‌هایی که حروف فارسی کامل دارند
      - name: Bundle Persian fonts
        run: |
          shopt -s nullglob
          V="$SRC/app/src/main/assets/vendor"; T="$RUNNER_TEMP/fonts"; mkdir -p "$T" && cd "$T"
          pip install -q fonttools brotli
          for p in sahel-font samim-font shabnam-font tanha-font parastoo-font gandom-font nahid-font \
            @fontsource/lalezar @fontsource/mirza @fontsource/amiri @fontsource/markazi-text @fontsource/reem-kufi \
            @fontsource/noto-naskh-arabic @fontsource/noto-sans-arabic @fontsource/noto-kufi-arabic @fontsource/ibm-plex-sans-arabic \
            @fontsource/readex-pro @fontsource/lateef @fontsource/scheherazade-new @fontsource/el-messiri @fontsource/changa \
            @fontsource/baloo-bhaijaan-2 @fontsource/cairo @fontsource/tajawal @fontsource/almarai @fontsource/mada \
            @fontsource/harmattan @fontsource/rakkas @fontsource/aref-ruqaa; do npm pack "$p" >/dev/null 2>&1 || echo "no $p"; done
          for f in *.tgz; do mkdir -p "x/$f" && tar -xzf "$f" -C "x/$f"; done
          mkdir -p x && python3 "$SRC/tools/fonts.py" "$T/x" "$V" || { echo "window.RS_XFONTS=[];" > "$V/xfonts.js"; : > "$V/xfonts.css"; }
          rm -rf "$SRC/tools"
          du -sh "$V/xfonts"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # APK برای دانلود مستقیم · AAB برای گوگل پلی (فقط برای صاحب مخزن)
      - name: Build (obfuscated release)
        run: cd "$SRC" && gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$SRC/app/build/outputs/apk/release/app-release.apk" Factor-Saz.apk
          cp "$SRC/app/build/outputs/bundle/release/app-release.aab" Factor-Saz-play.aab
          # نسخهٔ وب: همان صفحه‌ها و فایل‌های برنامه (سرور خودش از شاخهٔ dl برمی‌دارد)
          (cd "$SRC/app/src/main/assets" && zip -qr -X "$RUNNER_TEMP/web.zip" .)
          rm -rf "$SRC"
          gh release create "v${{ github.run_number }}" Factor-Saz.apk \
            --title "تضمین تراز v${{ github.run_number }}" \
            --notes "Made by (R.S) · فایل Factor-Saz.apk را دانلود و نصب کن (روی همهٔ گوشی‌های اندروید ۷ به بالا). همهٔ فاکتورها فقط روی همین گوشی ذخیره می‌شوند." \
            --repo "${{ github.repository }}"

      # آینه برای به‌روزرسانی داخل برنامه: شاخهٔ dl (از راه jsDelivr در شبکه‌هایی که گیت‌هاب کند یا بسته است)
      - name: Mirror for in-app update
        run: |
          mkdir -p "$RUNNER_TEMP/dl" && cp Factor-Saz.apk "$RUNNER_TEMP/dl/"
          cp "$RUNNER_TEMP/web.zip" "$RUNNER_TEMP/dl/"
          printf '{"tag":"v%s","size":%s}\n' "${{ github.run_number }}" "$(stat -c%s Factor-Saz.apk)" > "$RUNNER_TEMP/dl/version.json"
          cd "$RUNNER_TEMP/dl" && git init -q && git checkout -q -b dl
          git -c user.name=github-actions -c user.email=actions@github.com add . && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "v${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dl
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@dl/version.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@dl/Factor-Saz.apk" || true

      - name: Upload AAB (owner only, not public)
        uses: actions/upload-artifact@v4
        with:
          name: Factor-Saz-play-aab
          path: Factor-Saz-play.aab
          retention-days: 90
